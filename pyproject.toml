[project]
name = "tradenum"
version = "0.1.0"
description = "Numbered decision ledger for autonomous Alpaca options paper trading."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "alpaca-py>=0.40.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "mcp>=2.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
tradenum = "tradenum.cli:main"
tradenum-api = "tradenum.api:main"
tradenum-mcp = "tradenum.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
